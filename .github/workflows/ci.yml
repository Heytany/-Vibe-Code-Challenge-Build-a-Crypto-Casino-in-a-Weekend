name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version from package.json "packageManager" (pnpm@10.6.5) — do NOT add `version` here
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Env contract
        run: pnpm test:env

      - name: Motion unit tests
        run: pnpm test:motion

      - name: Production build
        run: pnpm build

      - name: Install Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E smoke
        run: pnpm test:e2e
