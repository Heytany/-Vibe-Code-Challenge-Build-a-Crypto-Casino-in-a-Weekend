<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect x="0" y="0" width="64" height="64" fill="#0a0a0a"/>
  <rect x="1" y="1" width="62" height="62" fill="none" stroke="#39ff14" stroke-width="2"/>
  <!-- antenna tips -->
  <rect x="16" y="4" width="5" height="5" fill="#39ff14"/>
  <rect x="43" y="4" width="5" height="5" fill="#39ff14"/>
  <rect x="17" y="9" width="3" height="5" fill="#f5f5f0"/>
  <rect x="44" y="9" width="3" height="5" fill="#f5f5f0"/>
